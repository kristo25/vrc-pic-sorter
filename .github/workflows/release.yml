name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  release:
    # The same gate as CI. A tag that cannot build, or that fails a test, must not
    # become a downloadable release.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VrcPicSorter.sln

      - name: Verify formatting
        run: dotnet format VrcPicSorter.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build VrcPicSorter.sln -c Release --no-restore

      - name: Test
        run: dotnet test VrcPicSorter.sln -c Release --no-restore --no-build

      - name: Publish portable executable
        run: dotnet publish src\VrcPicSorter.App\VrcPicSorter.App.csproj -p:PublishProfile=Portable

      - name: Verify published native codec and single-file extraction
        shell: pwsh
        run: ./scripts/portable-decode-smoke.ps1

      - name: Check the tag against the assembly version
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          $expected = $tag.TrimStart('v')
          $actual = (Get-Item publish/VrcPicSorter.exe).VersionInfo.ProductVersion.Split('+')[0]
          if ($actual -ne $expected) {
            throw "Tag $tag does not match the published version $actual. Update <Version> or retag."
          }
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Record the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/VrcPicSorter.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VrcPicSorter.exe" | Out-File publish/VrcPicSorter.exe.sha256 -Encoding ascii
          "SHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Package portable app and license notices
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath VrcPicSorter-win-x64.zip
          $hash = (Get-FileHash VrcPicSorter-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  VrcPicSorter-win-x64.zip" | Out-File VrcPicSorter-win-x64.zip.sha256 -Encoding ascii

      - name: Build the release notes from the changelog
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          $version = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version." }
          $rest = $lines[$start..($lines.Length - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $hash = (Get-Content publish/VrcPicSorter.exe.sha256).Split(' ')[0]
          $footer = @(
            ''
            '---'
            ''
            "SHA-256 of ``VrcPicSorter.exe``: ``$hash``"
            ''
            'The executable is not code-signed, so Windows SmartScreen warns on first run.'
            'Choose **More info** then **Run anyway**, or verify the checksum above first.'
          )
          ($body + $footer) | Out-File release-notes.md -Encoding utf8
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          gh release create $tag `
            publish/VrcPicSorter.exe `
            publish/VrcPicSorter.exe.sha256 `
            VrcPicSorter-win-x64.zip `
            VrcPicSorter-win-x64.zip.sha256 `
            publish/THIRD-PARTY-NOTICES.md `
            publish/MAGICK-NET-NOTICES.txt `
            --title $tag `
            --notes-file release-notes.md
